<circle cx="816" cy="230" r="5" fill="#B8E7C0" class="pulse"/>
<path d="M58 423H1143" stroke="#284B34" stroke-width="4"/>
<path d="M58 423H1143" stroke="url(#accent)" stroke-width="4" stroke-dasharray="190 895" class="scan"/>
<text x="1145" y="390" fill="#AAC5AF" font-family="ui-monospace,monospace" font-size="13" text-anchor="end" letter-spacing="1.1">THINK BUSINESS. BUILD TECHNOLOGY.</text>
<path d="M0 0h1200v454H0Z" fill="none" stroke="#577E60" stroke-opacity=".5" stroke-width="3"/>
