name: Update public GitHub profile snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: write

concurrency:
  group: profile-snapshot
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == '3zz2004/3zz2004'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Render verified GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_stats.py
      - name: Commit the updated image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-stats.png
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'chore: refresh public GitHub stats'
            git push
          fi
