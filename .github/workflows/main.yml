name: Update public GitHub profile snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'  # daily, 07:23 UTC; GitHub schedules can be delayed

permissions:
  contents: write

jobs:
  update:
    if: github.repository == '3zz2004/3zz2004'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Fetch public profile stats and render graphic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_stats.py
      - name: Commit refreshed graphic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/live-stats.png
          if git diff --cached --quiet; then
            echo 'No profile stats changes.'
          else
            git commit -m 'chore: refresh public GitHub snapshot'
            git push
          fi
