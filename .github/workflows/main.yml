name: Refresh EZZ animated profile artwork

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/profile_art.py"
      - "scripts/editorial_art.py"
      - ".github/workflows/main.yml"

permissions:
  contents: write

concurrency:
  group: ezz-profile-art
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == '3zz2004/3zz2004'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout GitHub profile
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image and HTML parsing libraries
        run: python -m pip install "Pillow>=11,<13" "beautifulsoup4>=4.12,<5"
      - name: Generate self-hosted animated SVGs from real GitHub data
        run: python scripts/profile_art.py
      - name: Render editorial profile visuals from real GitHub avatar
        run: python scripts/editorial_art.py
      - name: Publish fresh profile artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ezz-portrait.svg assets/ezz-heatmap.svg assets/ezz-stats.svg assets/ezz-identity.png assets/ezz-hero-premium.gif assets/ezz-disciplines-premium.gif assets/ezz-footer.gif assets/ezz-process.gif
          if git diff --cached --quiet; then
            echo "Profile visuals already current."
          else
            git commit -m "chore: refresh animated profile visuals [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
